name: 10분마다 경제 데이터 업데이트

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 중요: 깃허브에 파일을 쓸 수 있는 권한
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm install

      - name: 데이터 수집 및 JSON 생성
        run: npx tsx script/execute-cron.ts
        env:
          # GitHub Settings -> Secrets에 아래 키들이 등록되어 있어야 합니다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/market-data.json
          # 변경사항이 있을 때만 커밋 (없으면 에러 없이 통과)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 📈 실시간 데이터 업데이트" && git push)
